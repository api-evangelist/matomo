- aid: matomo:matomo-live-api
  name: Matomo Live API
  description: >-
    The Live! API lets you access complete visit level information about your visitors. Combined with
    the power of <a href='https://matomo.org/docs/analytics-api/segmentation/' target='_blank'>Segmentation</a>,
    you will be able to request visits filtered by any criteria.  The method "getLastVisitsDetails" will
    return extensive <a href='https://matomo.org/guide/apis/raw-data/'>RAW data</a> for each visit, which
    includes: server time, visitId, visitorId, visitorType (new or returning), number of pages, list of
    all pages (and events, file downloaded and outlinks clicked), custom variables names and values set
    to this visit, number of goal conversions (and list of all Goal conversions for this visit, with time
    of conversion, revenue, URL, etc.), but also other attributes such as: days since last visit, days
    since first visit, country, continent, visitor IP, provider, referrer used (referrer name, keyword
    if it was a search engine, full URL), campaign name and keyword, operating system, browser, type of
    screen, resolution, supported browser plugins (flash, java, silverlight, pdf, etc.), various dates
    & times format to make it easier for API users... and more!  With the parameter <a href='https://matomo.org/docs/analytics-api/segmentation/'
    rel='noreferrer' target='_blank'>'&segment='</a> you can filter the returned visits by any criteria
    (visitor IP, visitor ID, country, keyword used, time of day, etc.).  The method "getCounters" is used
    to return a simple counter: visits, number of actions, number of converted visits, in the last N minutes.  See
    also the documentation about <a href='https://matomo.org/docs/real-time/' rel='noreferrer' target='_blank'>Real
    time widget and visitor level reports</a> in Matomo. You may also be interested in steps to <a href='https://matomo.org/faq/how-to/faq_24536/'>export
    your RAW data to a data warehouse</a>.
  humanURL: https://developer.matomo.org/api-reference/reporting-api
  baseURL: https://{matomo_host}/index.php
  tags:
  - Live
  properties:
  - type: OpenAPI
    url: openapi/matomo-live-api-openapi.yml
  - type: Documentation

- aid: matomo:matomo-actions-api
  name: Matomo Actions API
  description: >-
    The Actions API lets you request reports for all your Visitor Actions: Page URLs, Page titles, Events,
    Content Tracking, File Downloads and Clicks on external websites.  For example, "getPageTitles" will
    return all your page titles along with standard <a href='https://matomo.org/docs/analytics-api/reference/#toc-metric-definitions'
    rel='noreferrer' target='_blank'>Actions metrics</a> for each row.  It is also possible to request
    data for a specific Page Title with "getPageTitle" and setting the parameter pageName to the page
    title you wish to request. Similarly, you can request metrics for a given Page URL via "getPageUrl",
    a Download file via "getDownload" and an outlink via "getOutlink".  Note: pageName, pageUrl, outlinkUrl,
    downloadUrl parameters must be URL encoded before you call the API.
  humanURL: https://developer.matomo.org/api-reference/reporting-api

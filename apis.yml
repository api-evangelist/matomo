- aid: matomo:matomo-matomo-php-api
  name: Matomo Tracking API (matomo.php entrypoint)
  description: >-
    The Matomo Tracking API — the server-side ingest entrypoint at /matomo.php that records
    pageviews, events, goals, ecommerce orders, site searches and content interactions. It is the
    counterpart to the JavaScript tracking client and the target of every first-party tracking SDK.
    On Matomo Cloud the tracking endpoints are explicitly exempt from the API rate limits that apply
    to reporting. There is no MCP tool for tracking: agents can read Matomo analytics but cannot
    write tracking events.
  humanURL: https://developer.matomo.org/api-reference/tracking-api
  baseURL: https://{matomo_host}/matomo.php

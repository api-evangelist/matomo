aid: matomo
name: Matomo
description: >-
  Matomo is an open source web analytics platform — self-hosted (Matomo On-Premise) or vendor-hosted
  (Matomo Cloud) — that gives an organisation complete ownership of its analytics data. Formerly
  Piwik, it is the leading privacy-first alternative to Google Analytics, with GDPR tooling, data
  residency in Frankfurt for Cloud, and no data sampling. Its API surface is substantial and
  unusual: 556 documented operations across 59 plugin modules, every one dispatched through a single
  /index.php RPC entrypoint on the customer's own deployment rather than a vendor host, plus a
  separate tracking entrypoint at /matomo.php. Matomo generates its own OpenAPI 3.1.0 documents
  through a first-party ApiReference plugin, and ships a first-party Model Context Protocol server
  exposing 19 agent tools over an authenticated HTTP endpoint.

aid: matomo
name: Matomo
description: >-
  Matomo is an open source web analytics platform that provides comprehensive
  website and application usage analytics with full data ownership. Formerly
  known as Piwik, it offers an alternative to Google Analytics with on-premise
  or cloud hosting options, ensuring complete control over analytics data and
  compliance with privacy regulations including GDPR.

apis:
- aid: matomo:live-api
  name: Matomo Live API
  description: >-
    The Matomo Live API provides real-time access to visitor data including the most recent visits, visitor
    profiles, and live counters showing current visitors on the site. It enables developers to build real-time
    dashboards, visitor activity feeds, and monitoring tools that display up-to-the-minute analytics data.
  humanURL: https://developer.matomo.org/api-reference/reporting-api#Live
  tags:
  - Analytics
  - Live Data
  - Real-Time
  - Visitors
  properties:
  - type: Documentation
    url: https://developer.matomo.org/api-reference/reporting-api#Live
- aid: matomo:goals-api
  name: Matomo Goals API
  description: >-
    The Matomo Goals API allows developers to manage and retrieve data about conversion goals. It supports
    creating, updating, and deleting goals, as well as retrieving goal conversion metrics, revenue data,
    and conversion rates segmented by various dimensions such as referrer, country, and device type.
  humanURL: https://developer.matomo.org/api-reference/reporting-api#Goals
  tags:
  - Analytics
  - Conversions
  - Goals
  - Revenue
  properties:
  - type: Documentation
    url: https://developer.matomo.org/api-reference/reporting-api#Goals
- aid: matomo:segments-api
  name: Matomo Segments API
  description: >-
    The Matomo Segments API enables developers to create and manage saved segments for filtering analytics
    data. Segments allow filtering visits and actions by any combination of visitor properties, behavior
    patterns, and custom dimensions. Any Reporting API method can accept a segment parameter to return
    data for a specific subset of visitors.
  humanURL: https://developer.matomo.org/api-reference/reporting-api-segmentation
  tags:
  - Analytics
  - Filters
  - Segmentation
  - Visitors
  properties:
  - type: Documentation
    url: https://developer.matomo.org/api-reference/reporting-api-segmentation

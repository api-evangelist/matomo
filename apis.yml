- aid: matomo:matomo-index-php-api
  name: Matomo Reporting API (index.php entrypoint)
  description: >-
    The single /index.php dispatch entrypoint through which every Matomo Reporting API method is
    invoked, by supplying module=API and method=Module.Action. This entry documents the entrypoint
    contract itself — the shared parameters (idSite, period, date, segment, format, token_auth) and
    the bulk-request form — rather than any one module. The per-module contracts are the 59 OpenAPI
    documents generated by Matomo's own ApiReference plugin.
  humanURL: https://developer.matomo.org/api-reference/reporting-api
  baseURL: https://{matomo_host}/index.php

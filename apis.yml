- aid: matomo:matomo-api-api
  name: Matomo API
  description: >-
    This API is the <a href='https://matomo.org/docs/analytics-api/metadata/' rel='noreferrer' target='_blank'>Metadata
    API</a>: it gives information about all other available APIs methods, as well as providing human readable
    and more complete outputs than normal API methods.  Some of the information that is returned by the
    Metadata API: <ul> <li>the dynamically generated list of all API methods via "getReportMetadata"</li>
    <li>the list of metrics that will be returned by each method, along with their human readable name,
    via "getDefaultMetrics" and "getDefaultProcessedMetrics"</li> <li>the list of segments metadata supported
    by all functions that have a 'segment' parameter</li> <li>the (truly magic) method "getProcessedReport"
    will return a human readable version of any other report, and include the processed metrics such as
    conversion rate, time on site, etc. which are not directly available in other methods.</li> <li>the
    method "getSuggestedValuesForSegment" returns top suggested values for a particular segment. It uses
    the Live.getLastVisitsDetails API to fetch the most recently used values, and will return the most
    often used values first.</li> </ul> The Metadata API is for example used by the Matomo Mobile App
    to automatically display all Matomo reports, with translated report & columns names and nicely formatted
    values. More information on the <a href='https://matomo.org/docs/analytics-api/metadata/' rel='noreferrer'
    target='_blank'>Metadata API documentation page</a>
  humanURL: https://developer.matomo.org/api-reference/reporting-api
  baseURL: https://{matomo_host}/index.php

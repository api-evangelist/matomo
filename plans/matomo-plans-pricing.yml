specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Matomo
providerId: matomo
generated: '2026-08-13'
method: searched
source: https://matomo.org/pricing/
docs: https://matomo.org/pricing/
created: '2026-05-04'
modified: '2026-08-13'
tags:
  - Analytics
  - Open Source
  - Privacy
  - Self-Hosted
  - Web Analytics
description: >-
  Matomo's published plans, read verbatim from https://matomo.org/pricing/ on
  2026-08-13. This artifact replaces a 2026-05-04 scaffold whose Free/Professional/
  Enterprise tiers and per-request quotas were invented and matched nothing Matomo
  sells. Matomo does not meter the API — it meters TRACKED HITS and seats. API access
  is included in every plan, on both hosting models, at no per-call price.
billing_note: >-
  Two distinct product lines. Matomo CLOUD is a hosted subscription priced by monthly
  tracked hits. Matomo ON-PREMISE is free open-source software; the paid On-Premise
  plans are annual PLUGIN BUNDLES plus support, not a licence for the platform itself.
api_metering:
  metered: false
  unit: null
  note: >-
    There is no API request quota, no per-call price and no API overage in any Matomo
    plan. "HTTP Analytics API" and "HTTP Tracking API" are listed as included in ALL
    plans. Usage is constrained at runtime by rate limits on Cloud only — see
    rate-limits/matomo-rate-limits.yml.
currency: EUR
plan_count: 7
plans:
  - id: matomo-cloud-business
    line: cloud
    name: Business
    type: paid
    price: '29.00'
    currency: EUR
    period: month
    price_note: >-
      €29/month excluding tax at the entry traffic tier (50,000 hits/month). Price
      increases with the traffic tier selected; annual billing gives 2 months free.
      Per-tier prices above the entry tier are rendered client-side by a traffic
      selector and are not captured here.
    traffic_tiers:
      - 50,000 hits per month
      - 100,000 hits per month
      - 300,000 hits per month
      - 600,000 hits per month
      - 1 million hits per month
      - 2 million hits per month
      - 5 million hits per month
      - More than 10 million hits per month (contact sales)
    overage: >-
      Additional hits are charged at a published per-hit rate shown against the selected
      tier ("Cost of additional hits").
    hosting: Matomo servers, Frankfurt, Germany
    trial: true
    trial_note: Free trial with access to all core features; no credit card required.
    limits:
      websites: 30
      team_members: 30
      segments: 100
      goals: 150
      custom_dimensions: 30
      custom_reports: 100
      forms: 100
      tag_manager_containers: 30
      raw_data_retention: 24 months
      report_data_retention: forever
      data_sampling: none
    elements:
      - HTTP Analytics API
      - HTTP Tracking API
      - API access
      - Google Analytics data importer
      - GDPR Manager
      - Crash Analytics
      - Funnels
      - Heatmap & Session Recording
      - A/B Testing
      - Custom Reports
      - Media Analytics
      - Roll-Up Reporting
      - Tag Manager
      - Email Support
  - id: matomo-cloud-enterprise
    line: cloud
    name: Enterprise
    type: enterprise
    price: custom
    currency: EUR
    period: custom
    price_note: Contact sales for custom pricing and allowances.
    hosting: Matomo servers, Frankfurt, Germany
    limits:
      websites: custom
      team_members: custom
      segments: custom
      goals: custom
      custom_dimensions: custom
      raw_data_retention: custom
      report_data_retention: forever
    elements:
      - Everything in Cloud Business
      - White Label with custom brand
      - SAML integration
      - LDAP integration
      - Custom Domain
      - Data Warehouse Connector
      - Customer Success Manager
  - id: matomo-on-premise-community
    line: on-premise
    name: Community
    type: free
    price: '0.00'
    currency: EUR
    period: perpetual
    hosting: Customer's own infrastructure, any location
    limits:
      users: unlimited
      hits: unlimited
    elements:
      - All base features
      - HTTP Analytics API
      - HTTP Tracking API
      - Community plugins
      - Forum support
    note: >-
      The full Matomo platform, free forever, with no vendor rate limits and no seat or
      hit cap. This is the tier most API consumers actually run against.
  - id: matomo-on-premise-team
    line: on-premise
    name: Team
    type: paid
    price: '275.00'
    currency: EUR
    period: year
    period_note: Annual billing shown; monthly billing available, annual saves 17%.
    limits:
      users: 4
      hits_per_month: 5000000
    support: Email support (24/5, 12-hr response)
    elements:
      - Custom Reports
      - Funnels
      - Users Flow
      - Media Analytics
      - Heatmaps & Session Recording
      - Form Analytics
      - Search Engine Keywords
      - WooCommerce
      - SEO Web Vitals
  - id: matomo-on-premise-business
    line: on-premise
    name: Business
    type: paid
    price: '1450.00'
    currency: EUR
    period: year
    limits:
      users: 20
      hits_per_month: 30000000
    support: Email support (24/5, 12-hr response)
    elements:
      - All Team plugins
      - Cohorts
      - Multi-channel Attribution
      - Activity Log
      - Roll-up Reporting
      - Advertising Conversion Export
      - White Label
  - id: matomo-on-premise-enterprise
    line: on-premise
    name: Enterprise
    type: paid
    price: '3400.00'
    currency: EUR
    period: year
    limits:
      users: 50
      hits_per_month: 100000000
    support: Dedicated Customer Success; Priority Email Support (24/5, 12-hr response); onboarding consultation; chat support
    elements:
      - All Business plugins
      - A/B Testing
      - SSO Authentication (SAML/LDAP)
      - Crash Analytics
  - id: matomo-on-premise-vip
    line: on-premise
    name: VIP
    type: enterprise
    price: custom
    currency: EUR
    period: custom
    limits:
      users: 51+
      hits_per_month: 100000000+
    support: Dedicated Customer Success; Priority Email support (24/5, 6-hr response); tailored onboarding with dedicated project manager; integration support consultations; chat support
    elements:
      - All Enterprise plugins
      - Custom configurations
discounts:
  - name: Annual billing
    detail: 2 months free on Cloud; 17% off On-Premise.
  - name: Non-profit
    detail: >-
      Eligible non-profits and charities may receive a discount; requires contacting
      Matomo. No published rate.
maintainers:

standards:
  - id: openapi-3.1
    conforms: true
    evidence: >-
      59 documents declaring `openapi: 3.1.0`, generated by Matomo's own first-party
      ApiReference plugin and served from a live instance. 556 operations, every one
      with an operationId, a description, tags, parameter descriptions and 400/401/403/
      404/500/default responses.
  - id: openapi-3.1-strict
    conforms: false
    evidence: >-
      The generated documents deviate from the specification in two ways. (1) Path
      keys carry a query string — `/index.php?module=API&method=VisitsSummary.get` —
      which OpenAPI does not permit; the path template is supposed to exclude the query
      component. (2) Some 200 responses serialize `content` media-type entries as EMPTY
      ARRAYS (`"application/json": []`) where the specification requires a Media Type
      Object. Both are artifacts of PHP's array/object ambiguity in json_encode. The
      documents are still useful and parse as JSON, but a strict OpenAPI validator will
      reject them.

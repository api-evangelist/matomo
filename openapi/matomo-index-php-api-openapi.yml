openapi: 3.2.0
info:
  title: Matomo Index.php API
  version: '1.0'
  description: 'Operations tagged Index.php across 2 of this provider''s published API definitions: matomo-api-openapi.json, matomo-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://demo-proxy.innocraft.cloud/
  description: Current Matomo instance
- url: https://{matomo_host}
  description: Your Matomo instance (self-hosted or Matomo Cloud)
  variables:
    matomo_host:
      default: demo.matomo.cloud
tags:
- name: Index.php
paths:
  /index.php?module=API&method=API.getMatomoVersion:
    get:
      tags:
      - Index.php
      description: Returns the current Matomo version.
      operationId: API.getMatomoVersion
      parameters:
      - $ref: '#/components/parameters/formatOptional'
      responses:
        '200':
          description: 'Matomo''s version string.


            Example responses require Super User access. Use Try it out to see a live response.'
          content:
            text/xml: []
            application/json: []
            application/vnd.ms-excel: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      security:
      - MatomoToken: []
      summary: API get matomo version
      x-summary-source: derived
    servers:
    - url: https://demo-proxy.innocraft.cloud/
      description: Current Matomo instance
  /index.php?module=API&method=API.getPhpVersion:
    get:
      tags:
      - Index.php
      description: Returns information about the PHP runtime version.
      operationId: API.getPhpVersion
      parameters:
      - $ref: '#/components/parameters/formatOptional'
      responses:
        '200':
          $ref: '#/components/responses/GenericArray'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      security:
      - MatomoToken: []
      summary: API get php version
      x-summary-source: derived
    servers:
    - url: https://demo-proxy.innocraft.cloud/
      description: Current Matomo instance
  /index.php?module=API&method=API.getIpFromHeader:
    get:
      tags:
      - Index.php
      description: Returns the most accurate IP address available for the current user, in IPv4 format. This could be the proxy client's IP address.
      operationId: API.getIpFromHeader
      parameters:
      - $ref: '#/components/parameters/formatOptional'
      responses:
        '200':
          description: 'IP address in presentation format.


            Example responses require Super User access. Use Try it out to see a live response.'
          content:
            text/xml: []
            application/json: []
            application/vnd.ms-excel: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      security:
      - MatomoToken: []
      summary: API get ip from header
      x-summary-source: derived
    servers:
    - url: https://demo-proxy.innocraft.cloud/
      description: Current Matomo instance
  /index.php?module=API&method=API.getSegmentsMetadata:
    get:
      tags:
      - Index.php
      description: Returns metadata for all available segments.
      operationId: API.getSegmentsMetadata
      parameters:
      - $ref: '#/components/parameters/formatOptional'
      - name: idSites
        in: query
        description: One or more site IDs. If empty, returns metadata visible to the current user.
        required: false
        schema:
          oneOf:
          - type: array
            items:
              type: integer
            default: []
          - type: integer
          - type: string
            default: '[]'
      - name: _hideImplementationData
        in: query
        description: Whether internal implementation details should be omitted.
        required: false
        schema:
          type: boolean
          default: true
      - name: _showAllSegments
        in: query
        description: Whether to include segments that are normally hidden.
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: 'OK


            Example responses require Super User access. Use Try it out to see a live response.'
          content:
            text/xml: []
            application/json: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      security:
      - MatomoToken: []
      summary: API get segments metadata
      x-summary-source: derived
    servers:
    - url: https://demo-proxy.innocraft.cloud/
      description: Current Matomo instance
  /index.php?module=API&method=API.getMetadata:
    get:
      tags:
      - Index.php
      description: Returns metadata for a specific API method.
      operationId: API.getMetadata
      parameters:
      - $ref: '#/components/parameters/formatOptional'
      - name: idSite
        in: query
        description: Site ID to use when loading metadata.
        required: true
        schema:
          oneOf:
          - type: integer
            example: 1
          - type: string
            example: '1'
      - name: apiModule
        in: query
        description: API module name.
        required: true
        schema:
          type: string
          example: VisitsSummary
      - name: apiAction
        in: query
        description: API method name without the module prefix.
        required: true
        schema:
          type: string
          example: get
      - name: apiParameters
        in: query
        description: Additional API parameters used to resolve metadata variants.
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
      - name: language
        in: query
        description: Optional language code used to localize the response.
        required: false
        schema:
          type: string
      - name: period
        in: query
        description: Optional period used to resolve period-dependent metadata.
        required: false
        schema:
          type: string
      - name: date
        in: query
        description: Optional date or date range used to resolve metadata.
        required: false
        schema:
          type: string
      - name: hideMetricsDoc
        in: query
        description: Whether metric documentation should be omitted.
        required: false
        schema:
          type: boolean
          default: false
      - name: showSubtableReports
        in: query
        description: Whether subtable reports should be included.
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: 'OK


            Example responses require Super User access. Use Try it out to see a live response.'
          content:
            text/xml: []
            application/json: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      security:
      - MatomoToken: []
      summary: API get metadata
      x-summary-source: derived
    servers:
    - url: https://demo-proxy.innocraft.cloud/
      description: Current Matomo instance
  /index.php?module=API&method=API.getReportMetadata:
    get:
      tags:
      - Index.php
      description: Returns metadata for all available reports.
      operationId: API.getReportMetadata
      parameters:
      - $ref: '#/components/parameters/formatOptional'
      - name: idSites
        in: query
        description: Deprecated fallback for specifying one or more site IDs.
        required: false
        schema:
          oneOf:
          - type: array
            items:
              type: integer
          - type: integer
          - type: string
            default: ''
      - name: period
        in: query
        description: Optional period used to resolve report metadata.
        required: false
        schema:
          type: string
      - name: date
        in: query
        description: Optional date or date range used to resolve report metadata.
        required: false
        schema:
          type: string
      - name: hideMetricsDoc
        in: query
        description: Whether metric documentation should be omitted.
        required: false
        schema:
          type: boolean
          default: false
      - name: showSubtableReports
        in: query
        description: Whether subtable reports should be included.
        required: false
        schema:
          type: boolean
          default: false
      - name: idSite
        in: query
        description: Preferred site ID parameter.
        required: false
        schema:
          oneOf:
          - type: integer
          - type: string
      responses:
        '200':
          description: 'OK


            Example responses require Super User access. Use Try it out to see a live response.'
          content:
            text/xml: []
            application/json: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      security:
      - MatomoToken: []
      summary: API get report metadata
      x-summary-source: derived
    servers:
    - url: https://demo-proxy.innocraft.cloud/
      description: Current Matomo instance
  /index.php?module=API&method=API.getProcessedReport:
    get:
      tags:
      - Index.php
      description: Returns a processed report with metadata, formatting, and processed metrics applied.
      operationId: API.getProcessedReport
      parameters:
      - $ref: '#/components/parameters/formatOptional'
      - name: idSite
        in: query
        description: Site ID to query.
        required: true
        schema:
          oneOf:
          - type: integer
            example: 1
          - type: string
            example: '1'
      - name: period
        in: query
        description: Report period.
        required: true
        schema:
          type: string
          example: day
      - name: date
        in: query
        description: Date or date range to query.
        required: true
        schema:
          type: string
          example: yesterday
      - name: apiModule
        in: query
        description: API module name.
        required: true
        schema:
          type: string
          example: VisitsSummary
      - name: apiAction
        in: query
        description: API method name without the module prefix.
        required: true
        schema:
          type: string
          example: get
      - name: segment
        in: query
        description: Optional segment expression.
        required: false
        schema:
          type: string
      - name: apiParameters
        in: query
        description: Additional API parameters forwarded to the target report.
        required: false
        schema:
          oneOf:
          - type: array
            items:
              type: string
          - type: string
      - name: idGoal
        in: query
        description: Optional goal ID.
        required: false
        schema:
          oneOf:
          - type: integer
          - type: string
      - name: language
        in: query
        description: Optional language code for the response.
        required: false
        schema:
          type: string
      - name: showTimer
        in: query
        description: Whether processing time information should be included.
        required: false
        schema:
          type: boolean
          default: true
      - name: hideMetricsDoc
        in: query
        description: Whether metric documentation should be omitted.
        required: false
        schema:
          type: boolean
          default: false
      - name: idSubtable
        in: query
        description: Optional subtable ID to load.
        required: false
        schema:
          oneOf:
          - type: integer
          - type: string
      - name: showRawMetrics
        in: query
        description: Whether raw metrics should be included alongside formatted metrics.
        required: false
        schema:
          type: boolean
          default: false
      - name: format_metrics
        in: query
        description: Optional metrics formatting mode.
        required: false
        schema:
          type: string
      - name: idDimension
        in: query
        description: Optional dimension ID.
        required: false
        schema:
          oneOf:
          - type: integer
          - type: string
      responses:
        '200':
          description: 'OK


            Example responses require Super User access. Use Try it out to see a live response.'
          content:
            text/xml: []
            application/json: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        default:
          $ref: '#/components/responses/DefaultError'
      security:
      - MatomoToken: []
      summary: API get processed report
      x-summary-source: derived
    servers:
    - url: https://demo-proxy.innocraft.cloud/
      description: Current Matomo instance

ownership: These specs are Matomo's own. They are not hand-written by API Evangelist and not third-party.
  Matomo ships a first-party plugin, ApiReference, that generates an OpenAPI 3.1.0 document per installed
  plugin and exposes it through the Reporting API method ApiReference.getOpenApiSpec. Every document self-identifies
  as Matomo (info.title 'Matomo Reporting API for <Plugin> plugin') and declares Matomo's own MatomoToken
  bearer security scheme. They were fetched unauthenticated from demo.matomo.cloud, Matomo's official
  public demo instance, linked from https://matomo.org/demo/.
servers_note: 'The verbatim servers[] entry reads https://demo-proxy.innocraft.cloud/ rather than a matomo.org
  host. This is expected and correct, not a wrong-company contract: InnoCraft Ltd is the New Zealand company
  that develops Matomo and operates Matomo Cloud, and demo.matomo.cloud is served through InnoCraft''s
  cloud proxy. The value is also instance-specific by nature — Matomo is self-hosted or Matomo Cloud,
  so the real API host is always the customer''s own deployment. The overlays in overlays/ record the
  templated https://{matomo_host} form without mutating the harvested documents.'
known_deviations:
- Path keys carry a query string (/index.php?module=API&method=VisitsSummary.get), which OpenAPI does
  not permit in a path template.
- 'Some 200 responses serialize content media-type entries as empty arrays ("application/json": []) where
  a Media Type Object is required. A PHP json_encode array/object artifact.'
surface_is_per_deployment: This harvest reflects the plugins activated on Matomo's demo instance (Matomo
  5.13.0-rc1, observed 2026-08-13), including premium Cloud plugins. A different Matomo deployment will
  expose a different subset. Call ApiReference.getOpenApiSpec against the target instance to get its real
  contract.

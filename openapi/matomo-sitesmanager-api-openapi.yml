        required: true
        schema:
          type: string
          example: view
      - name: pattern
        in: query
        description: Optional name/URL pattern to filter results by.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of sites to return, or `null` for no limit.
        required: false
        schema:
          type: integer
      - name: sitesToExclude
        in: query
        description: Site IDs to exclude from the result.
        required: false
        schema:
          type: array
          items:
            type: integer
          default: []
      - name: siteTypesToExclude

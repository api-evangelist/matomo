          oneOf:
          - type: integer
            example: 1
          - type: string
            example: '1'
      - name: period
        in: query
        description: Report period.
        required: true
        schema:
          type: string
          example: day
      - name: date
        in: query
        description: Date or date range to query.
        required: true
        schema:
          type: string
          example: yesterday
      - name: apiModule
        in: query
        description: API module name.
        required: true
        schema:
          type: string
          example: VisitsSummary
      - name: apiAction
        in: query
        description: API method name without the module prefix.
        required: true
        schema:
          type: string
          example: get
      - name: segment
        in: query
        description: Optional segment expression.
        required: false
        schema:
          type: string
      - name: apiParameters
        in: query
        description: Additional API parameters forwarded to the target report.
        required: false
        schema:
          oneOf:
          - type: array

versioning:
  scheme: semver-platform
  current: 5.12.0
  current_release_date: '2026-07-14'
  docs: https://matomo.org/changelog/
  api_versioning: none
  note: >-
    The Reporting API carries NO version in the URL, in a header, or in the spec beyond
    a flat info.version of 1.0.0 on every generated document. The API surface is
    versioned by the Matomo RELEASE installed on the instance and by which plugins are
    activated — two instances on the same Matomo version can expose different methods.
    This is the defining lifecycle property of a self-hosted product and it means an
    agent must discover the surface at runtime (API.getReportMetadata /
    ApiReference.getOpenApiSpec) rather than assume it.
  concurrent_branches:
    - branch: '5.x'
      status: current
    - branch: '4.x'
      status: maintenance
      last_seen: 4.16.2 (2025-11-20)
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  spec_deprecated_operations: 0
  migration_guides:
    - https://developer.matomo.org/guides/migrate-matomo-4-to-5
    - https://developer.matomo.org/guides/migrate-matomo-3-to-4
    - https://developer.matomo.org/guides/migrate-piwik-2-to-3
  note: >-
    Matomo publishes NO deprecation policy. There is no /guides/deprecation page
    (probed 2026-08-13, HTTP 404) — what exists instead is a per-major-version
    migration guide written after the fact. Matomo emits no RFC 8594 Sunset or
    Deprecation response headers, and NOT ONE of the 556 operations across the 59
    generated OpenAPI documents carries `deprecated: true`. A client therefore gets no
    deprecation signal from the runtime, the contract, or a stated policy. No
    `Deprecation` pointer is emitted in apis.yml for this provider, because a migration
    guide published alongside a breaking release is not a deprecation policy.

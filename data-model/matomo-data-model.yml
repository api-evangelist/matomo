source: >-
  openapi/matomo-*-openapi.json — 59 first-party OpenAPI 3.1.0 documents, 556
  operations. Entities and relationships were derived from the id-reference parameters
  that recur across operations, not from a published object reference.
derivation_note: >-
  Matomo's generated OpenAPI documents contain almost NO response schemas — every
  successful response is declared as a description plus empty media-type entries, and
  `components.schemas` holds only the generic success/error envelopes. There is
  therefore no $ref graph to walk. What follows is derived instead from the identifier
  PARAMETERS the operations require, which is the only structural evidence the contract
  gives. Field-level shapes are not asserted because the provider does not publish them.
root_entity:
  name: Site
  key: idSite
  note: >-
    Nearly everything in Matomo hangs off a site. 368 of 556 operations take idSite,
    and almost every other entity is scoped to one. There is no account/organization
    object above it in the API — the instance itself is the tenant boundary.
entities:
